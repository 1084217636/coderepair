name: Code Change Platform CI

on:
  push:
    branches: ["agent-code-change-platform"]
  pull_request:
    branches: ["agent-code-change-platform"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: code-change-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-change-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Lint code-change extension
        working-directory: backend
        run: |
          uv run ruff check packages/harness/deerflow/code_change tests/code_change app/gateway/routers/code_change.py
          uv run ruff format --check packages/harness/deerflow/code_change tests/code_change app/gateway/routers/code_change.py

      - name: Run code-change tests
        working-directory: backend
        run: PYTHONPATH=. uv run pytest tests/code_change -q

      - name: Import smoke test
        working-directory: backend
        run: >-
          PYTHONPATH=. uv run python -c
          "from app.gateway.routers.code_change import router;
          from deerflow.code_change.models import TaskStatus;
          assert str(TaskStatus.HANDOFF_READY) == 'HANDOFF_READY';
          assert router.prefix == '/api/code-change'"
